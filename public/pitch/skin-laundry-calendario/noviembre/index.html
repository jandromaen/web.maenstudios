:root{
  /* Paleta oficial · SL_BrandColors.pdf */
  --cream:#F6EDE4;      /* Off-white */
  --cream-2:#F4D0B1;    /* Scale 1 */
  --cream-3:#E7B48F;    /* Scale 2 */
  --clay:#D29E7C;       /* Scale 3 */
  --rust:#B37344;       /* Scale 4 */
  --tan:#88583B;        /* Scale 6 */
  --choc:#3C201D;       /* Scale 7 */
  --cocoa:#3C201D;
  --lime:#CDF765;       /* Highlight Green */
  --ink:#1A1312;        /* Black */
  --black:#1A1312;
  --white:#FFFFFF;
  --line:rgba(60,32,29,.16);
  --serif:"SL Apris",Georgia,serif;
  --sans:"SL Articulat","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#120c0a;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* ---------- Visor ---------- */
#viewport{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--cream);overflow:hidden;opacity:0;visibility:hidden;transition:opacity .35s ease}
.slide.active{opacity:1;visibility:visible}
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#cbbfb5}
#bar .brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
#bar .ctrls{display:flex;align-items:center;gap:10px}
#bar button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:transparent;color:#efe6de;font-size:16px;cursor:pointer;display:grid;place-items:center}
#bar button:hover{border-color:var(--lime);color:var(--lime)}
#bar button:disabled{opacity:.3;cursor:default}
#count{font-size:12px;letter-spacing:.08em;min-width:62px;text-align:center;color:#efe6de}
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--lime);transition:width .35s ease}
@media (max-width:560px){#bar .brand{display:none}}

/* ---------- Elementos comunes ---------- */
.top{position:absolute;left:56px;right:56px;top:28px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink);padding-bottom:16px;border-bottom:1px solid var(--line)}
.top .mark{height:12px;width:auto}
.foot{position:absolute;left:56px;right:56px;bottom:26px;display:flex;justify-content:space-between;font-size:11px;color:var(--tan)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tan)}
.h-serif{font-family:var(--serif);font-weight:300;letter-spacing:-.01em;line-height:1}
.logo-dark{}
.logo-light{}
.wordmark{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;line-height:1}

/* ---------- Portada ---------- */
.cover{background:#cbb7a2}
.cover .photo{position:absolute;inset:0;background:#cbb7a2 center right/cover no-repeat}
.cover .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(60,32,30,.38) 0%,rgba(60,32,30,.12) 45%,rgba(60,32,30,0) 65%)}
.cover .side{position:absolute;left:0;top:0;bottom:0;width:640px;color:var(--white);padding:110px 72px 64px;display:flex;flex-direction:column}
.cover .side .logo{width:250px}
.cover .side .eyebrow{color:var(--white);margin-top:auto;opacity:.9}
.cover h1{font-size:80px;margin-top:18px;color:var(--white)}
.cover .rule{width:96px;height:3px;background:var(--lime);margin:30px 0 26px}
.cover .month{font-family:var(--serif);font-size:44px;font-weight:300;color:var(--white)}
.cover .meta{margin-top:auto;font-size:15px;line-height:1.5;color:var(--white);font-weight:300;opacity:.92}
.cover .cta{display:inline-block;align-self:flex-start;margin-top:22px;background:var(--white);color:var(--black);font-size:13px;padding:11px 18px;border-radius:3px}
.promo{position:absolute;left:0;right:0;top:0;height:30px;background:var(--lime);color:var(--black);display:flex;align-items:center;justify-content:center;font-size:12px;z-index:3}
.slide.light .top{top:46px}

/* ---------- Calendario ---------- */
.cal-wrap{position:absolute;left:56px;top:108px;width:700px}
.cal-title{font-size:54px;display:flex;align-items:baseline;gap:14px}
.cal-title span{font-size:36px;color:var(--tan)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 6px;font-size:11px;letter-spacing:.12em;color:var(--tan);text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{height:72px;border-radius:4px;padding:8px 9px;position:relative;font-family:var(--serif);font-size:22px;line-height:1;background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.cell .lbl{font-family:var(--sans);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;line-height:1.25}
.cell.out{background:transparent;border:1px solid rgba(93,50,22,.08);color:rgba(93,50,22,.28)}
.cell.pend{border:1px solid rgba(93,50,22,.18);border-bottom:3px solid var(--lime);cursor:pointer;transition:transform .15s}
.cell.pend .lbl{color:var(--tan)}
.cell.go{cursor:pointer;transition:transform .15s}
.cell.go:hover,.cell.pend:hover{transform:translateY(-2px)}
.cell.f-reel{background:var(--choc);color:var(--cream);border-color:var(--choc)}
.cell.f-carrusel{background:var(--black);color:var(--cream);border-color:var(--black)}
.cell.f-post{background:var(--tan);color:var(--cream);border-color:var(--tan)}
.cell.f-stories{background:var(--cream-2);border-color:var(--cream-3)}
.cell .flag{position:absolute;top:7px;right:7px;width:16px;height:16px;border-radius:50%;background:var(--lime);color:var(--black);font-family:var(--sans);font-size:12px;font-weight:700;display:grid;place-items:center}
.panel{position:absolute;right:56px;top:108px;width:380px;bottom:62px;background:var(--choc);color:var(--cream);padding:30px 30px;display:flex;flex-direction:column}
.panel .eyebrow{color:#e6d6c7}
.panel .ph-top{height:92px;margin:-30px -30px 18px;background:#cbb7a2 center 30%/cover no-repeat;position:relative}
.panel .ph-top::after{content:"";position:absolute;left:30px;bottom:-1px;width:60px;height:3px;background:var(--lime)}
.legend{background:var(--cream);color:var(--ink);padding:14px 16px;margin-top:14px;display:grid;gap:8px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:10px}
.sw{width:14px;height:14px;border-radius:2px;flex:none}
.sw.pend{border:1px solid var(--line);border-bottom:3px solid var(--lime);background:#fff}
.dates{margin-top:16px;font-size:12.5px;line-height:1.6;color:#efe3d8;font-weight:300}
.dates b{font-weight:700;color:var(--cream)}
.dates .flag{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--lime);color:var(--black);font-size:11px;font-weight:700;margin-right:6px;vertical-align:-2px}
.big{margin-top:auto;font-family:var(--serif);font-weight:300;font-size:92px;line-height:.9}
.big-sub{font-family:var(--serif);font-size:26px;font-weight:300;margin-top:4px}
.big-note{font-size:12.5px;color:#e6d6c7;margin-top:12px;line-height:1.5;font-weight:300}

/* ---------- Feed ---------- */
.feed-text{position:absolute;left:56px;top:118px;width:440px}
.feed-text h2{font-size:56px;margin-top:14px}
.feed-text h2 em{font-style:normal;color:var(--tan)}
.feed-text p{margin-top:22px;font-size:15px;line-height:1.55;color:var(--ink);font-weight:300}
.feed-text p+p{font-size:13px;color:var(--tan);margin-top:14px}
.feed-photo{position:absolute;left:56px;bottom:62px;width:440px;height:170px;background:#cbb7a2 center/cover no-repeat}
.feed-photo span{position:absolute;left:0;bottom:0;background:var(--lime);color:var(--black);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px}
.phone{position:absolute;top:116px;width:236px;height:470px;border-radius:34px;background:var(--black);padding:9px}
.phone .scr{width:100%;height:100%;border-radius:26px;background:#fff;overflow:hidden;position:relative}
.phone .notch{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:74px;height:18px;border-radius:12px;background:var(--black);z-index:2}
.ig-head{padding:34px 12px 8px;font-size:9px}
.ig-head .u{font-weight:700;font-size:10px}
.ig-prof{display:flex;align-items:center;gap:14px;margin:10px 0 8px}

  copy:`Definición, no exceso

Este es un caso real de nuestra clínica: labios tratados con ácido hialurónico para recuperar contorno e hidratación, sin cambiar sus facciones.

El ácido hialurónico es una molécula que tu piel ya fabrica: retiene agua y da volumen. Con los años producimos menos, por eso la piel pierde jugosidad y los labios, definición.
💧 En sérum: hidrata la superficie, cada día.
💉 Inyectado: aporta volumen y definición justo donde se ha perdido.

¿Se nota «hecho»? No si se hace bien. ¿Es reversible? Sí, se puede disolver con hialuronidasa. ¿Cuánto dura? Depende de la zona y de cada persona: te lo explicamos en la valoración.

Desliza para ver el antes y el después 👉

  copy:`Rojeces o granitos: no son lo mismo.

Rosácea y acné se parecen, pero no se tratan igual.

La rosácea se ve como una rojez difusa en mejillas, nariz y mentón, a veces con capilares visibles. La encienden el calor, el sol, el estrés, el alcohol o la cosmética agresiva. El error común: exfoliar más para «limpiar» la rojez.

Para la rosácea trabajamos con Signature Collagen Facial, Calm & Clear (IPL) y Mesotox. Para el acné, con Hollywood Carbon Peel, Signature Brightening y Blemiderm. A veces conviven, por eso siempre empezamos con una valoración médica.

  cam:'<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="14" rx="3.5"/><path d="M8.5 6l1.6-2.5h3.8L15.5 6"/><circle cx="12" cy="13" r="3.6"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20.3s-7.6-4.5-9.4-9.4C1.3 7.4 3.6 4.3 7 4.3c2.1 0 3.7 1.2 5 3 1.3-1.8 2.9-3 5-3 3.4 0 5.7 3.1 4.4 6.6-1.8 4.9-9.4 9.4-9.4 9.4z"/></svg>',
  com:'<svg viewBox="0 0 24 24"><path d="M20.7 16.4A9 9 0 1 0 17 20.2l4.5 1.3z"/></svg>',
  rep:'<svg viewBox="0 0 24 24"><path d="M16.5 3l3 3-3 3"/><path d="M4.5 11.5V10a4 4 0 0 1 4-4h11"/><path d="M7.5 21l-3-3 3-3"/><path d="M19.5 12.5V14a4 4 0 0 1-4 4h-11"/></svg>',
  send:'<svg viewBox="0 0 24 24"><path d="M21.5 2.5 10.2 13.8"/><path d="M21.5 2.5 14.6 21l-4.4-7.2L3 9.4z"/></svg>',
  dots:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>',
  note:'<svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
  off:'<svg class="off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>',
  on:'<svg class="on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>'
};
function reelCard(p) {
  /* Vídeo en formato normal: sin interfaz de Instagram encima, solo se reproduce al darle al play */
  const vid = p.media && isVid(p.media);
  const bg = !p.media ? `<div class="guion"><span>Guion</span><ol>${(p.idea || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`
    : vid ? `<video src="${esc(p.media)}" ${p.poster ? `poster="${esc(p.poster)}"` : ""} controls playsinline preload="metadata"></video>`
    : `<img class="bg" src="${esc(p.media)}" alt="">`;
  return `<div class="reel-ig plain${vid ? "" : " is-static"}">${bg}</div>`;
}
/* Al cambiar de diapositiva, el vídeo que deja de verse se pausa */
setInterval(() => {
  document.querySelectorAll(".reel-ig video").forEach(v => {
    const r = v.getBoundingClientRect();
    const vis = r.width > 0 && r.right > 0 && r.left < innerWidth && r.bottom > 0 && r.top < innerHeight;
    if (!vis && !v.paused) v.pause();
  });
}, 400);
/* Story de repost: lo que se verá de verdad en la story (el reel compartido + los stickers) */
function repostStory(p) {
  const vid = p.media && isVid(p.media);
  const bgImg = p.poster || (!vid && p.media) || "";
  const inner = vid
    ? `<video src="${esc(p.media)}" ${p.poster ? `poster="${esc(p.poster)}"` : ""} playsinline preload="metadata" onclick="event.stopPropagation();this.paused?this.play():this.pause();this.parentNode.classList.toggle('playing',!this.paused)" onended="this.parentNode.classList.remove('playing')"></video><span class="rp-play">${RI.play}</span>`
    : `<div class="rp-pend"><span>Reel</span>${esc(p.pieza)}</div>`;
  const st = (p.repost || []).map(s =>
      s.t === "link" ? `<span class="rp-link">🔗 ${esc(s.txt)}</span>`
    : s.t === "poll" ? `<div class="rp-poll"><b>${esc(s.q)}</b>${s.o.map(o => `<span>${esc(o)}</span>`).join("")}</div>`
    : s.t === "slider" ? `<div class="rp-slider"><b>${esc(s.q)}</b><i><em>${s.e}</em></i><small>${esc(s.txt)}</small></div>`
    : s.t === "question" ? `<div class="rp-q"><b>${esc(s.q)}</b><span>Escribe algo…</span></div>` : "").join("");
  return `<div class="tpl sm repost${(p.repost || []).length > 1 ? " two" : ""}">
    ${bgImg ? `<div class="rp-bg" style="background-image:url('${esc(bgImg)}')"></div>` : `<div class="rp-bg plain"></div>`}
    <div class="tpl-top"><i><img src="${PERFIL.avatar}" alt=""></i>skinlaundry_es</div>
    <div class="rp-card"><div class="rp-hd"><i><img src="${PERFIL.avatar}" alt=""></i>skinlaundry_es</div><div class="rp-media">${inner}</div></div>
    <div class="rp-st">${st}</div>
  </div>`;
}
/* ==== fin REELS estilo Instagram ==== */

const pad = n => String(n).padStart(2,"0");
const FMT_COLOR = { reel:"var(--tan)", carrusel:"var(--choc)", post:"var(--rust)", stories:"var(--cream-2)" };
const dayName = d => DOW[new Date(YEAR, MONTH, d).getDay()];
const piezasDe = d => PIEZAS.filter(p => p.d === d);
const nlDe = d => NEWSLETTERS.find(n => n.d === d);
const avatar = `<img src="${ASSET.fav}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.remove()">`;

const slides = [];
const topBar = () => `<div class="promo">Instagram ${HANDLE} · Contenido del ${START} al ${END} de noviembre</div><div class="top"><span>Skin Laundry · Calendario de publicaciones</span><img class="mark" src="${ASSET.logo}" alt="Skin Laundry"><span>Noviembre ${YEAR}</span></div>`;
const foot = n => `<div class="foot"><span>${HANDLE}</span><span>${pad(n)}</span></div>`;

const nR = PIEZAS.filter(p=>fk(p.formato)==="reel").length;
const nC = PIEZAS.filter(p=>fk(p.formato)==="carrusel").length;
const nP = PIEZAS.filter(p=>fk(p.formato)==="post").length;
const fmtLista = nP ? `${nR} reels, ${nC} carruseles y ${nP} posts` : `${nR} reels y ${nC} carruseles`;
const resumen = `${PIEZAS.length} publicaciones · ${fmtLista} · ${NEWSLETTERS.length} newsletters · stories a diario del ${START} al ${END}`;

/* Orden de diapositivas por día (un día con 2 piezas = 2 diapositivas) */
const FIXED = 6;                       // portada, calendario, feed, destacados, stories, newsletters
const dayIndex = {}; let cursor = FIXED;
const dayPlan = [];
for (let d = START; d <= END; d++) {
  const ps = piezasDe(d);
  dayIndex[d] = cursor + 1;
  if (ps.length) ps.forEach((p, i) => { dayPlan.push({ d, p, i, of: ps.length }); cursor++; });
  else { dayPlan.push({ d, s: STORIES[d] }); cursor++; }
}

/* 1 · Portada */
slides.push(() => `
<section class="slide cover">
  <div class="photo" style="background-image:url('${ASSET.cover}')"></div>
  <div class="shade"></div>
  <div class="side">
    <img class="logo" src="${ASSET.logoLight}" alt="Skin Laundry">
    <div class="eyebrow">Instagram · ${HANDLE}</div>
    <h1 class="h-serif">Calendario de publicaciones</h1>
    <div class="rule"></div>
    <div class="month">Noviembre ${YEAR}</div>
    <div class="meta">${resumen}</div>
    <span class="cta" data-go="2">Ver calendario →</span>
  </div>
</section>`);

/* 2 · Calendario mensual */
slides.push(n => {
  const lead = (new Date(YEAR, MONTH, 1).getDay() + 6) % 7;
  const days = new Date(YEAR, MONTH+1, 0).getDate();
  const prevDays = new Date(YEAR, MONTH, 0).getDate();
  const total = Math.ceil((lead + days) / 7) * 7;
  let cells = "";
  for (let i = 0; i < total; i++) {
    const d = i - lead + 1;
    if (d < 1 || d > days) { cells += `<div class="cell out">${d<1 ? prevDays + d : d - days}</div>`; continue; }
    if (d < START) { cells += `<div class="cell out">${d}</div>`; continue; }
    const ps = piezasDe(d), nl = nlDe(d);
    const flag = FECHAS[d] ? `<span class="flag" title="${esc(FECHAS[d])}">+</span>` : "";
    const nlTag = nl ? `<span class="nl" title="Newsletter">✉</span>` : "";
    if (ps.length) {
      const cols = ps.map(p => FMT_COLOR[fk(p.formato)]);
      const bg = cols.length > 1 ? `background:linear-gradient(135deg,${cols[0]} 50%,${cols[1]} 50%);border-color:${cols[0]}` : "";
      const lbl = ps.map(p => esc(p.formato)).join(" + ");
      const tema = ps.map(p => esc(p.tema)).join(" · ");
      cells += `<div class="cell go f-${fk(ps[0].formato)}" style="${bg}" data-go="${dayIndex[d]}">${d}${flag}${nlTag}<span class="lbl">${lbl}<em>${tema}</em></span></div>`;
    } else {
      cells += `<div class="cell go f-stories" data-go="${dayIndex[d]}">${d}${flag}${nlTag}<span class="lbl">Stories<em>${esc(STORIES[d]?.titulo || "")}</em></span></div>`;
    }
  }
  const fechas = Object.entries(FECHAS).map(([d,t]) => `<b>${d}</b> ${esc(t)}`).join(" · ");
  const nls = NEWSLETTERS.map(x => `<b>${x.d}</b> ${esc(x.nombre)}`).join(" · ");
  return `
<section class="slide light">
  ${topBar()}
  <div class="cal-wrap">
    <div class="cal-title h-serif">Calendario <span>noviembre</span></div>
    <div class="dow"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="grid">${cells}</div>
  </div>
  <aside class="panel">
    <div class="ph-top" style="background-image:url('${ASSET.laser}')"></div>
    <div class="eyebrow">Instagram</div>
    <div class="legend">
      <div><span class="sw" style="background:var(--tan)"></span><b>Reel</b>&nbsp;· ${nR}</div>
      <div><span class="sw" style="background:var(--choc)"></span><b>Carrusel</b>&nbsp;· ${nC}</div>
      ${nP ? `<div><span class="sw" style="background:var(--rust)"></span><b>Post</b>&nbsp;· ${nP}</div>` : ""}
      <div><span class="sw" style="background:var(--cream-2);border:1px solid var(--cream-3)"></span><b>Stories</b>&nbsp;· pack semanal + reposts</div>
    </div>
    <div class="dates"><span class="flag">+</span><b>Fechas señaladas</b> · ${fechas}<br><span class="flag nlf">✉</span><b>Newsletters</b> · ${nls}</div>
    <div class="big">${PIEZAS.length}</div>
    <div class="big-sub">publicaciones</div>
    <div class="big-note">${fmtLista} del ${START} al ${END} de noviembre, con stories de apoyo cada día.</div>
  </aside>
  ${foot(n)}
</section>`;
});

/* 3 · Feed (réplica del perfil real a escala iPhone) */
const igIcon = t => t === "reel" ? `<i class="gi">▶</i>` : t === "carrusel" ? `<i class="gi">❐</i>` : "";
const igPhone = (cls = "") => {
  const nov = [...PIEZAS].sort((a,b) => b.d - a.d || PIEZAS.indexOf(b) - PIEZAS.indexOf(a));
  const tile = (src, tipo, extra = "") => `<div class="t">${src ? `<img src="${esc(src)}" alt="">` : ""}${igIcon(tipo)}${extra}</div>`;
  const novTile = p => (p.poster || (p.media && !isVid(p.media)))
    ? tile(p.poster || p.media, fk(p.formato), `<span class="dd">${p.d} nov</span>`)
    : `<div class="t pend m-${fk(p.formato)}"><b>${p.d}</b><em>${esc(p.formato)}</em>${igIcon(fk(p.formato))}</div>`;
  const pins = PERFIL.fijadas.map(s => tile(s, "", `<i class="gi pin">📌</i>`)).join("");
  const total = PERFIL.publicaciones + PIEZAS.length;
  const hl = DESTACADOS.map(h => `<div class="h"><span style="background-image:url('${h.cover}')"></span><em>${esc(h.nombre)}</em></div>`).join("");
  return `
  <div class="iph ${cls}"><div class="iph-in">
    <div class="sb"><b>10:52</b><span>▮▮▮ ◠ ▭</span></div>
    <div class="nav"><span class="bk">‹</span><b>skinlaundry_es</b><span class="ic">🔔︎ ···</span></div>
    <div class="feed-scroll">
      <div class="prof">
        <div class="av"><img src="${PERFIL.avatar}" alt=""></div>
        <div class="pm">
          <b class="nm">${esc(PERFIL.nombre)}</b>
          <div class="st"><div><b>${total}</b><span>publicaciones</span></div><div><b>${PERFIL.seguidores}</b><span>seguidores</span></div><div><b>${PERFIL.seguidos}</b><span>seguidos</span></div></div>
        </div>
      </div>
      <div class="bio">${PERFIL.bio.map(esc).join("<br>")}<br><span class="lk">${esc(PERFIL.ubicacion)}</span><div class="url">🔗 ${esc(PERFIL.link)}</div></div>
      <div class="btns"><span>Siguiendo ⌄</span><span>Mensaje</span><span>Contactar</span><span class="sm">+</span></div>
      <div class="hls">${hl}</div>
      <div class="tabs"><span class="on">▦</span><span>▷</span><span>◫</span></div>
      <div class="igrid">${pins}${nov.map(novTile).join("")}${PERFIL.anteriores.map(o => tile(o.src, o.tipo)).join("")}</div>
    </div>
  </div><div class="island"></div></div>`;
};
slides.push(n => {
  const total = PERFIL.publicaciones + PIEZAS.length;
  return `
<section class="slide light">
  ${topBar()}
  <div class="feed-text">
    <div class="eyebrow">${HANDLE}</div>
    <h2 class="h-serif">Feed de <em>noviembre</em></h2>
    <p>Así quedará el perfil a 30 de noviembre: las 3 fijadas actuales arriba y, debajo, las ${PIEZAS.length} piezas del mes en cuadrícula 3:4, la más reciente primero. Detrás siguen las publicaciones que ya existen.</p>
    <p>El móvil se puede desplazar para ver el mes entero.</p>
    <div class="feed-stats"><div><b>${PERFIL.publicaciones}</b><span>hoy</span></div><div class="arrow">→</div><div><b>${total}</b><span>a 30 nov</span></div><div><b>+${PIEZAS.length}</b><span>en noviembre</span></div></div>
  </div>
  <div class="iph-wrap" style="left:600px"><span class="iph-lbl">Perfil</span>${igPhone()}</div>
  <div class="iph-wrap" style="left:880px"><span class="iph-lbl">Al deslizar</span>${igPhone("scrolled")}</div>
  ${foot(n)}
</section>`;
});

/* 4 · Destacados */
slides.push(n => `
<section class="slide light">
  ${topBar()}
  <div class="hl-head">
    <div class="eyebrow">Stories · destacados</div>
    <h2 class="h-serif">Ordenar los <em>destacados</em></h2>
    <p>Portadas de textura en un mismo tono, nombres de una palabra y un orden que acompaña al cliente (descubrir → tratamientos → pruebas → confianza → visitarnos). Las texturas son las de la carpeta TEXTURAS del Drive, así que es 100 % Skin Laundry.</p>

    <p class="hl-note">Colores planos, «Friends V» y «Friends I» duplicados, «You» poco claro y sin destacados de tratamientos.</p>

    <div class="hl-grid">${DESTACADOS.map((h,i) => `
      <div class="hl-card">
        <div class="hl big"><span style="background-image:url('${h.cover}')"></span></div>
        <div><b>${esc(h.nombre)}</b><small>${esc(h.contenido)}</small><i>${h.antes === "Nuevo" ? "Nuevo" : "Antes: " + esc(h.antes)}</i></div>
      </div>`).join("")}</div>
  </div>
  ${foot(n)}
</section>`);

/* 5 · Sistema de stories */

    ${bg ? `<img src="${bg}" alt=""><div class="veil"></div>` : ""}

    <div class="tpl-in">${inner}</div>
    <img class="tpl-logo" src="${ASSET.logoLight}" alt="">
  </div>`;
slides.push(n => {
  const P = d => ({ 9: ASSET.laser, 30: ASSET.cover, 12: ASSET.glow, 10: ASSET.group })[d] || ASSET.cover;
  return `
<section class="slide light">
  ${topBar()}
  <div class="tpl-head">

    <div class="tpl-col">${tplStory(P(12), `<h4>PREGUNTAS FRECUENTES SOBRE NEUROMODULADORES</h4><ol class="faq"><li>¿Me cambiará la expresión?</li><li>¿Cuánto dura el efecto?</li><li>¿Duele?</li><li>¿Cuándo veo el resultado?</li><li>¿Qué zonas se tratan?</li></ol>`)}<b>FAQ</b><small>Respuestas de la doctora</small><em class="dest">Se guarda en: FAQ</em></div>

      <ol style="display:none">
      </ol>
    </div>
  </div>
  ${foot(n)}
</section>`;
});

/* Diapositivas por día */
const ph = txt => `<div class="ph-media"><div class="plus">+</div><span>${txt}</span></div>`;
const tagsFor = (d, fmtHtml, extra = "") => {
  const nl = nlDe(d);
  return `<div class="tags">${fmtHtml}${extra}${nl ? `<span class="tag plus">+ Newsletter</span>` : ""}</div>`;
};
const headFor = (d, pill, sub = "") => `
    <div class="day-meta">
      <span class="eyebrow">${HANDLE}</span>
      ${pill}
    </div>
    <h2 class="h-serif">${dayName(d)} ${d}</h2>
    <div class="sub">${dayName(d).toLowerCase()} ${d} de noviembre de ${YEAR}${sub}</div>
    ${FECHAS[d] ? `<div class="special"><span class="flag">+</span>Fecha señalada · <b>${esc(FECHAS[d])}</b></div>` : ""}`;

dayPlan.forEach(item => {
  slides.push(n => {
    const d = item.d, nl = nlDe(d);
    const nlChip = nl ? `<span class="chip">Newsletter · ${esc(nl.nombre)}</span>` : "";
    if (item.p) {
      const p = item.p, f = fk(p.formato);
      const isReel = f === "reel";
      const ready = p.estado === "listo";
      const precio = /€/.test(p.copy);
      return `
<section class="slide light">
  ${topBar()}
  <div class="day-left">
    ${headFor(d, `<span class="pill"><b>${esc(p.cubo)}</b>${esc(p.tema)}</span>`, item.of > 1 ? ` · pieza ${item.i + 1} de ${item.of}` : "")}
    ${tagsFor(d, `<span class="tag fmt ${f === "reel" ? "reel" : f === "post" ? "post" : ""}">${esc(p.formato)} de Instagram</span>`, `<span class="tag plus">+ Stories</span>`)}
    <div class="pieza">${esc(p.pieza)}</div>
    <div class="copy">
      <div class="copy-h"><span class="eyebrow">Copy</span></div>
      <div class="txt">${esc(p.copy)}</div>
    </div>
    <div class="meta-row">
      <span><b>CTA</b>${esc(p.cta)}</span>
      <span><b>Base</b>${esc(p.base)}</span>
    </div>
  </div>
  <div class="day-right">
    <div class="post-frame ${isReel ? "is-reel" : ""}">
      <div class="col-lbl">${esc(p.formato)}</div>
      ${isReel ? reelCard(p) : ""}<div class="ig-card" ${isReel ? 'style="display:none"' : ""}>
        <div class="hd"><i>${avatar}</i>skinlaundry_es</div>
        <div class="media pf m-${f} ${p.media ? "has-media" : ""}">
          ${p.media ? `${mediaTag(p.media, p.poster)}${isReel && !isVid(p.media) ? `<span class="play">▶</span>` : f === "carrusel" ? `<span class="pages">1/${p.slides ? p.slides.length : Math.max(3, p.idea.length)}</span>` : ""}<div class="idea over"><span>${isReel ? "Guion" : f === "carrusel" ? "Slides" : "Visual"}</span><ol>${p.idea.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : `<div class="idea"><span>${isReel ? "Guion" : f === "carrusel" ? "Slides" : "Visual"}</span><ol>${p.idea.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`}
        </div>
        <div class="ft"><span>♡</span><span>◯</span><span>➤</span><span style="margin-left:auto">⌑</span></div>
      </div>
      ${p.slides ? `<div class="slides">${p.slides.map((x,i) => `<div><img src="${esc(x)}" alt=""><span>${i+1}</span></div>`).join("")}</div>` : ""}
      ${p.fuente ? `<div class="src"><b>Material</b>${esc(p.fuente)}</div>` : ""}
    </div>
    <div class="story-frame" style="left:330px">
      <div class="col-lbl">Story de apoyo</div>
      ${p.repost ? repostStory(p) : p.storyImgs ? `<div class="tpl sm" style="cursor:pointer" title="Toca para ver la siguiente story" onclick="const im=this.querySelectorAll('img');let i=[...im].findIndex(x=>x.style.opacity!=='0');im[i].style.opacity=0;i=(i+1)%im.length;im[i].style.opacity=1;this.querySelector('b').textContent=(i+1)+' / '+im.length">${p.storyImgs.map((x,i) => `<img src="${esc(x)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s;opacity:${i ? 0 : 1}">`).join("")}<b style="position:absolute;top:8px;right:8px;background:rgba(26,19,18,.65);color:#F6EDE4;font:600 10px/1 sans-serif;padding:4px 7px;border-radius:10px">1 / ${p.storyImgs.length}</b></div>` : p.storyImg ? `<div class="tpl sm"><img src="${esc(p.storyImg)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></div>` : tplStory((p.slides || p.poster) ? "" : p.media, `<h4>${esc(p.tema.toUpperCase())}</h4><div class="pills">${p.story.map(x => `<span>${esc(x)}</span>`).join("")}</div><span class="sticker">🔗 Ver publicación</span>`, "sm")}
      ${destacadoDe(p) ? `<div class="hl-chip"><span style="background-image:url('${(DESTACADOS.find(h => h.nombre === destacadoDe(p)) || {}).cover}')"></span>Guardar en <b>${esc(destacadoDe(p))}</b></div>` : ""}
    </div>
    <div class="hours"><span class="eyebrow">Hora</span><span class="chip">${esc(p.formato)} · ${esc(p.hora)}</span><span class="chip">Story · 1h después</span>${nlChip}</div>
  </div>
  ${foot(n)}
</section>`;
    }
    const s = item.s || { titulo: "Stories", items: [], hora: "" };
    return `
<section class="slide light">
  ${topBar()}
  <div class="day-left">
    ${headFor(d, `<span class="pill"><b>Stories</b>${esc(s.titulo)}</span>`)}
    ${tagsFor(d, `<span class="tag fmt stories-tag">Stories de Instagram</span>`)}
    <div class="pieza">${esc(s.titulo)}</div>
    <div class="copy">
      <div class="copy-h"><span class="eyebrow">Secuencia</span></div>
      <ol class="seq">${s.items.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
      <div class="ph-note">Día sin publicación en el feed: las stories mantienen la presencia y empujan a las piezas de la semana.</div>
    </div>
  </div>
  <div class="day-right">
    <div class="col-lbl">Stories del día</div>
    <div class="story-row">
      ${s.imgs ? s.imgs.map(x => `<div class="tpl sm3"><img src="${esc(x)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></div>`).join("") : s.items.map((x, i) => tplStory(s.media, `<span class="num">${pad(i + 1)}</span><h4>${esc(x.toUpperCase())}</h4>${i === s.items.length - 1 ? `<span class="sticker">🔗 Reserva</span>` : ""}`, "sm3")).join("")}
    </div>
    ${DESTACADO_STORY[d] ? `<div class="hl-chip st"><span style="background-image:url('${(DESTACADOS.find(h => h.nombre === DESTACADO_STORY[d]) || {}).cover}')"></span>Guardar en el destacado <b>${esc(DESTACADO_STORY[d])}</b></div>` : ""}
    <div class="hours"><span class="eyebrow">Hora</span><span class="chip">Stories · ${esc(s.hora)}</span>${nlChip}</div>
  </div>
  ${foot(n)}
</section>`;
  });
});

/* Newsletters (al final, tras el calendario de redes) */
slides.push(n => `
<section class="slide light">
  ${topBar()}
  <div class="nl-head">
    <div class="eyebrow">Email marketing</div>
    <h2 class="h-serif">Newsletters de <em>noviembre</em></h2>
    <p>Una newsletter temática y una de promociones al mes, para que la comunidad sepa que siempre hay algo.</p>
  </div>
  <div class="nl-photo" style="background-image:url('${ASSET.group}')"><span>Treat. Glow. Repeat.</span></div>
  <div class="nl-cards">
    ${NEWSLETTERS.map(x => `
    <div class="nl-card ${fk(x.tipo) === "promo" ? "promo-card" : ""}">
      <div class="nl-top"><span class="nl-type">${esc(x.tipo)}</span><span class="nl-date">${dayName(x.d)} ${x.d} nov</span></div>
      <div class="nl-name h-serif">${esc(x.nombre)}</div>
      <div class="nl-row"><span>Asunto A</span>${esc(x.asuntoA)}</div>
      <div class="nl-row"><span>Asunto B</span>${esc(x.asuntoB)}</div>
      <div class="nl-row"><span>Contenido</span>${esc(x.contenido)}</div>
      <div class="nl-foot"><span class="chip">CTA · ${esc(x.cta)}</span><span class="chip">Público · ${esc(x.publico)}</span></div>
    </div>`).join("")}
  </div>
  ${foot(n)}
</section>`);

/* Cierre */
slides.push(() => `
<section class="slide end">
  <div class="photo" style="background-image:url('${ASSET.glow}')"></div>
  <div class="inner">
  <img class="logo" src="${ASSET.logoLight}" alt="Skin Laundry">
  <div class="sep"></div>
  <div class="cap">Calendario de publicaciones · Noviembre ${YEAR}</div>
  <div class="accent"></div>
  </div>
</section>`);

/* ---------- Render + navegación ---------- */
const stage = document.getElementById("stage");
stage.innerHTML = slides.map((fn, i) => fn(i + 1)).join("");
stage.querySelectorAll(".iph.scrolled .feed-scroll").forEach(el => { requestAnimationFrame(() => { const g = el.querySelector(".igrid"); el.scrollTop = g.offsetTop + g.children[0].offsetHeight * 2 + 4; }); });
/* Copys: siempre a dos columnas y con el mismo cuerpo de letra en todo el calendario;
   si alguno no cabe, se reduce el cuerpo en todos por igual para que ninguno se corte */
function fitCopys() {
  const boxes = [...stage.querySelectorAll(".copy")].filter(c => c.querySelector(".txt"));
  let size = 11;
  const over = () => boxes.some(c => c.scrollHeight > c.clientHeight + 1);
  const apply = s => boxes.forEach(c => c.querySelector(".txt").style.fontSize = s + "px");
  apply(size);
  while (over() && size > 8.5) { size = Math.round((size - 0.25) * 100) / 100; apply(size); }
}
fitCopys();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCopys);
const els = [...stage.querySelectorAll(".slide")];
const N = els.length;
let cur = 0;
const countEl = document.getElementById("count"), prog = document.getElementById("progress");
const prevB = document.getElementById("prev"), nextB = document.getElementById("next");
function go(i, push = true) {
  cur = Math.max(0, Math.min(N - 1, i));
  els.forEach((s, k) => s.classList.toggle("active", k === cur));
  countEl.textContent = `${pad(cur + 1)} / ${pad(N)}`;
  prog.style.width = `${((cur + 1) / N) * 100}%`;
  prevB.disabled = cur === 0; nextB.disabled = cur === N - 1;
  els.forEach((s, k) => s.querySelectorAll("video").forEach(v => { if (k !== cur) v.pause(); }));
  if (push) { try { history.replaceState(null, "", `#${cur + 1}`); } catch (e) {} }
}
function fit() {
  const vp = document.getElementById("viewport");
  const s = Math.min(vp.clientWidth / 1280, vp.clientHeight / 720) * 0.96;
  stage.style.transform = `scale(${s})`;
}
prevB.onclick = () => go(cur - 1);
nextB.onclick = () => go(cur + 1);
document.getElementById("fs").onclick = () => { try { const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); p?.catch?.(() => {}); } catch (e) {} };
document.addEventListener("keydown", e => {
  if (["ArrowRight","PageDown"," "].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (["ArrowLeft","PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(N - 1);
});
stage.addEventListener("click", e => { const c = e.target.closest("[data-go]"); if (c) go(+c.dataset.go - 1); });
let tx = null;
addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1)); tx = null; });
addEventListener("resize", fit);
fit();
let start = 1; try { start = parseInt(location.hash.slice(1)) || 1; } catch (e) {}
go(start - 1, false);

</script>
<!-- ==== CARRUSEL estilo Instagram ==== -->
<style>
.car-ig{position:absolute;inset:0;overflow:hidden;touch-action:pan-y}
.car-ig .trk{display:flex;height:100%;transition:transform .32s cubic-bezier(.25,.8,.25,1)}
.car-ig .trk img{position:static!important;flex:0 0 100%;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
.car-ig .nav{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.88);box-shadow:0 1px 4px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer;z-index:3;transition:opacity .2s}
.car-ig .nav svg{width:12px;height:12px;fill:none;stroke:#262626;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.car-ig .nav.nx{right:9px}.car-ig .nav.pv{left:9px}
.car-ig .nav[hidden]{display:none}
.car-ig .cnt{position:absolute;top:10px;right:10px;z-index:3;background:rgba(18,18,18,.72);color:#fff;font:600 10px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:5px 8px;border-radius:12px}
.media.pf.is-car>img,.media.pf.is-car>.pages{display:none!important}
.ig-card .ft{position:relative}
.ig-card .ft .car-dots{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:4px}
.ig-card .ft .car-dots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7;transition:background .2s}
.ig-card .ft .car-dots i.on{background:#0095f6}
.slides div{cursor:pointer}
.slides div.on{outline:2px solid #0095f6;outline-offset:1px}
</style>
<script>
(function () {
  const CH = d => `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
  function build(frame) {
    const thumbs = [...frame.querySelectorAll(".slides img")];
    const media = frame.querySelector(".media.pf");
    if (thumbs.length < 2 || !media || media.querySelector(".car-ig")) return;
    const srcs = thumbs.map(t => t.getAttribute("src"));
    media.classList.add("is-car");
    const car = document.createElement("div");
    car.className = "car-ig";
    car.innerHTML = `<div class="trk">${srcs.map(u => `<img src="${u}" alt="" draggable="false">`).join("")}</div>
      <span class="cnt">1/${srcs.length}</span>
      <button class="nav pv" aria-label="Anterior" hidden>${CH("M15 5l-7 7 7 7")}</button>
      <button class="nav nx" aria-label="Siguiente">${CH("M9 5l7 7-7 7")}</button>`;
    media.prepend(car);
    const ft = frame.querySelector(".ig-card .ft");
    const dots = document.createElement("span");
    dots.className = "car-dots";
    dots.innerHTML = srcs.map(() => "<i></i>").join("");
    if (ft) ft.appendChild(dots);
    const trk = car.querySelector(".trk"), cnt = car.querySelector(".cnt");
    const pv = car.querySelector(".pv"), nx = car.querySelector(".nx");
    const tw = [...frame.querySelectorAll(".slides div")];
    let i = 0;
    const show = k => {
      i = Math.max(0, Math.min(srcs.length - 1, k));
      trk.style.transform = `translateX(${-100 * i}%)`;
      cnt.textContent = `${i + 1}/${srcs.length}`;
      pv.hidden = i === 0; nx.hidden = i === srcs.length - 1;
      [...dots.children].forEach((d, j) => d.classList.toggle("on", j === i));
      tw.forEach((d, j) => d.classList.toggle("on", j === i));
    };
    const stop = e => { e.stopPropagation(); e.preventDefault(); };
    nx.addEventListener("click", e => { stop(e); show(i + 1); });
    pv.addEventListener("click", e => { stop(e); show(i - 1); });
    tw.forEach((d, j) => d.addEventListener("click", e => { stop(e); show(j); }));
    let x0 = null;
    car.addEventListener("pointerdown", e => { x0 = e.clientX; });
    car.addEventListener("pointerup", e => {
      if (x0 === null) return;
      const dx = e.clientX - x0; x0 = null;
      if (Math.abs(dx) > 30) { show(i + (dx < 0 ? 1 : -1)); }
    });
    ["touchstart", "touchend", "touchmove"].forEach(t => car.addEventListener(t, e => e.stopPropagation(), { passive: true }));
    show(0);
  }
  const run = () => document.querySelectorAll(".post-frame").forEach(build);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
  new MutationObserver(run).observe(document.getElementById("stage") || document.body, { childList: true, subtree: false });
})();
</script>
